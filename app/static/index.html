<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBSS-AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__mark">◆</span>
          <div>
            <h1 class="brand__title">CBSS-AI</h1>
            <p class="brand__subtitle">A self-contained assistant demo</p>
          </div>
        </div>
        <span id="status" class="status status--pending">connecting…</span>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer" autocomplete="off">
        <input
          id="input"
          class="composer__input"
          type="text"
          name="message"
          placeholder="Ask me to do math, reverse text, or type 'help'…"
          aria-label="Message"
        />
        <button id="send" class="composer__send" type="submit">Send</button>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
